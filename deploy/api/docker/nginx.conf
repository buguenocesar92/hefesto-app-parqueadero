# Nginx interno del contenedor de la API.
#
# No es el servidor publico: el navegador nunca habla con este nginx. Caddy
# (deploy/caddy/Caddyfile) es el unico que recibe peticiones del exterior y las
# reparte. Este nginx atiende las comprobaciones internas de salud del
# orquestador.
#
# El sitio real de la API lo atiende php-fpm, que escucha en el puerto 9000 del
# contenedor.

server {
    # php-fpm ya ocupa el 9000 en este mismo contenedor, asi que nginx escucha
    # en el 8080.
    listen 8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20m;

    # La aplicacion se invoca siempre por index.php: es lo que espera Laravel.
    # Las rutas las resuelve el enrutador, no nginx.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found on; }
    location = /robots.txt  { access_log off; log_not_found on; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60;

        # La foto de un vehiculo es evidencia de un reclamo. El proxy la pasa
        # como `X-Forwarded-Proto` y `X-Forwarded-For`, y aca se traducen a las
        # cabeceras que espera Laravel. Sin esto, la bitacora guardaria siempre
        # la direccion del proxy interno y no la de la persona.
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
    }

    # Ningun archivo fuera de `public` se sirve: ni `.env`, ni `storage`, ni el
    # codigo fuente. En un estacionamiento el `.env` tiene las credenciales de
    # la base y el `storage` tiene las fotos de los vehiculos.
    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}