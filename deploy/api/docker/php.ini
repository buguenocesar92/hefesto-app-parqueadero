; Configuracion de PHP para el sistema de estacionamientos.
; Valores pensados para un estacionamiento de PyME: carga baja y errores
; visibles.

[PHP]
; El limite de memoria holga para el calculo del cobro y la busqueda en el
; registro por ventana de fechas, que son las operaciones mas pesadas.
memory_limit = 256M

; Errores a pantalla solo en desarrollo: en produccion un error con detalle
; puede mostrar rutas internas o consultas SQL a un visitante.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

; Fecha y hora: el estacionamiento opera en horario de Chile.
;
; OJO: esto cambia como se MUESTRA la hora, no como se cobra. El tiempo
; facturable sale de `ingreso_en` y `salida_en`, que son `timestamptz` y los
; guarda PostgreSQL en UTC. La duracion cobrada es correcta en cualquier zona
; horaria; lo que se muestra es lo que el operador ve.
date.timezone = America/Santiago

; Sesion y cookies
session.cookie_httponly = 1
; `use_strict_mode` obliga al navegador a mandar el id de sesion que le dio el
; servidor: sin esto, un id inventado por alguien mas seria aceptado.
session.use_strict_mode = 1
session.use_only_cookies = 1

; No exponer la version de PHP en las cabeceras.
expose_php = Off

; El limite de archivos subidos tiene que ser suficiente para una foto de
; vehiculo hecha con un telefono en la oscuridad.
upload_max_filesize = 10M
post_max_size = 12M

[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Con `validate_timestamps = 0` PHP no vuelve a leer los archivos modificados.
; Es lo correcto en produccion porque la imagen es inmutable, pero DESPUES de
; cambiar codigo hay que reiniciar el contenedor, no basta con recargar.
opcache.validate_timestamps = 0