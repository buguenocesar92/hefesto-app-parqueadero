; Supervisor: php-fpm (que atiende la API) y nginx interno.
; Los dos viven en el mismo contenedor porque la API es chica: no hace falta
; un contenedor aparte solo para poder escalarlo mas adelante.
;
; PUERTOS: php-fpm escucha en 127.0.0.1:9000 y nginx en 0.0.0.0:8080. No pueden
; compartir el 9000: es el conflicto clasico cuando se meten los dos procesos
; en la misma imagen.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10